plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}
version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }
neoForge {
    version = neoforge_version
    runs { client { client() }; server { server() } }
    mods { "${mod_id}" { sourceSet sourceSets.main } }
}
tasks.withType(ProcessResources).configureEach {
    var props = [minecraft_version:minecraft_version, minecraft_version_range:minecraft_version_range, neoforge_version:neoforge_version, neoforge_version_range:neoforge_version_range, loader_version_range:loader_version_range, mod_id:mod_id, mod_name:mod_name, mod_license:mod_license, mod_version:mod_version, mod_authors:mod_authors, mod_description:mod_description]
    inputs.properties props
    filesMatching(['META-INF/neoforge.mods.toml']) { expand props }
}

tasks.named('jar', Jar).configure {
    from('LICENSE') {
        rename { 'LICENSE_Ambush.txt' }
    }
}
